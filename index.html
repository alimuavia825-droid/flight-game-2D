
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY WAR - Air Strike</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #071426;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  padding: 12px;
  color: #ffd34e;
  letter-spacing: 3px;
}

#hud {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  font-size: 15px;
  background: #102b4a;
}

canvas {
  display: block;
  margin: auto;
  background: #0879bd;
  width: min(100vw, 480px);
  height: calc(100dvh - 100px);
  touch-action: none;
}

#message {
  position: absolute;
  top: 45%;
  left: 0;
  width: 100%;
  pointer-events: none;
  font-size: 25px;
  color: #ffdf55;
  text-shadow: 2px 2px black;
}

button {
  background: #e5a627;
  color: #111;
  border: 0;
  border-radius: 8px;
  padding: 10px 22px;
  margin: 8px;
  font-weight: bold;
  cursor: pointer;
}

</style>
</head>

<body>

<h1>SKY WAR</h1>

<div id="hud">
  <span>Score: <b id="score">0</b></span>
  <span>Lives: <b id="lives">3</b></span>
  <span>Level: <b id="level">1</b></span>
</div>

<canvas id="game"></canvas>

<div id="message">
  SKY WAR<br>
  <button onclick="startGame()">START GAME</button>
</div>

<div>
  <button onclick="togglePause()">PAUSE / RESUME</button>
  <button onclick="startGame()">RESTART</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
const levelText = document.getElementById("level");
const message = document.getElementById("message");

const W = 480;
const H = 650;

canvas.width = W;
canvas.height = H;

let player, bullets, enemies, enemyBullets;
let particles, stars, boss;
let score = 0;
let lives = 3;
let level = 1;
let frame = 0;
let running = false;
let paused = false;
let keys = {};
let spawnTimer = 0;
let bossSpawned = false;

function resetGame() {
  score = 0;
  lives = 3;
  level = 1;
  frame = 0;
  spawnTimer = 0;
  bossSpawned = false;

  bullets = [];
  enemies = [];
  enemyBullets = [];
  particles = [];
  boss = null;

  player = {
    x: W / 2,
    y: H - 85,
    w: 34,
    h: 44,
    speed: 5,
    cooldown: 0,
    invincible: 0
  };

  stars = Array.from({length: 90}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    speed: 1 + Math.random() * 3,
    size: Math.random() * 2 + 1
  }));

  updateHUD();
}

function updateHUD() {
  scoreText.textContent = score;
  livesText.textContent = lives;
  levelText.textContent = level;
}

function startGame() {
  resetGame();
  running = true;
  paused = false;
  message.style.display = "none";
  requestAnimationFrame(loop);
}

function togglePause() {
  if (!running) return;

  paused = !paused;

  if (paused) {
    message.innerHTML = "PAUSED";
    message.style.display = "block";
  } else {
    message.style.display = "none";
    requestAnimationFrame(loop);
  }
}

function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#0876bb");
  gradient.addColorStop(1, "#033e78");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  stars.forEach(s => {
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillRect(s.x, s.y, s.size, s.size);

    s.y += s.speed;

    if (s.y > H) {
      s.y = 0;
      s.x = Math.random() * W;
    }
  });

  // Moving clouds
  for (let i = 0; i < 4; i++) {
    let x = (i * 145 + frame * 0.4) % (W + 100) - 50;
    let y = (i * 165 + 100) % H;

    ctx.fillStyle = "rgba(230,245,255,0.25)";
    ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 10, 20, 0, Math.PI * 2);
    ctx.arc(x + 35, y + 5, 24, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlane(x, y, color, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -24);
  ctx.lineTo(8, -5);
  ctx.lineTo(25, 8);
  ctx.lineTo(22, 15);
  ctx.lineTo(7, 10);
  ctx.lineTo(5, 22);
  ctx.lineTo(0, 19);
  ctx.lineTo(-5, 22);
  ctx.lineTo(-7, 10);
  ctx.lineTo(-22, 15);
  ctx.lineTo(-25, 8);
  ctx.lineTo(-8, -5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#dcefff";
  ctx.fillRect(-3, -8, 6, 13);

  ctx.restore();
}

function shoot() {
  bullets.push({
    x: player.x,
    y: player.y - 25,
    speed: 9,
    damage: 1
  });
}

function spawnEnemy() {
  const x = 35 + Math.random() * (W - 70);

  enemies.push({
    x,
    y: -40,
    hp: 2 + Math.floor(level / 3),
    speed: 1.5 + Math.random() * 1.5 + level * 0.2,
    fire: Math.random() * 100
  });
}

function spawnExplosion(x, y, color = "#ffb52e") {
  for (let i = 0; i < 16; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 7,
      vy: (Math.random() - 0.5) * 7,
      life: 30,
      color
    });
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });

  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}

function hit(a, b, radius = 25) {
  return Math.hypot(a.x - b.x, a.y - b.y) < radius;
}

function spawnBoss() {
  boss = {
    x: W / 2,
    y: 100,
    hp: 80,
    maxHp: 80,
    direction: 1,
    fire: 0
  };
  bossSpawned = true;
}

function drawBoss() {
  if (!boss) return;

  ctx.save();
  ctx.translate(boss.x, boss.y);

  // Large enemy battleship
  ctx.fillStyle = "#555f6b";
  ctx.fillRect(-95, -24, 190, 48);

  ctx.fillStyle = "#89949f";
  ctx.fillRect(-45, -42, 90, 20);

  ctx.fillStyle = "#333e4a";
  ctx.fillRect(-12, -58, 24, 20);

  ctx.fillStyle = "#ffdf48";
  ctx.beginPath();
  ctx.arc(0, -25, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = "#222";
  ctx.fillRect(90, 20, 300, 12);

  ctx.fillStyle = "#e52f2f";
  ctx.fillRect(90, 20, 300 * boss.hp / boss.maxHp, 12);

  ctx.fillStyle = "white";
  ctx.font = "12px Arial";
  ctx.fillText("BOSS HEALTH", 90, 15);
}

function updateBoss() {
  if (!boss) return;

  boss.x += boss.direction * 2;

  if (boss.x > W - 110 || boss.x < 110) {
    boss.direction *= -1;
  }

  boss.fire++;

  if (boss.fire > 45) {
    enemyBullets.push({
      x: boss.x - 30,
      y: boss.y + 30,
      speed: 4
    });

    enemyBullets.push({
      x: boss.x + 30,
      y: boss.y + 30,
      speed: 4
    });

    boss.fire = 0;
  }
}

function update() {
  frame++;

  // Player movement
  if (keys.ArrowLeft || keys.a) player.x -= player.speed;
  if (keys.ArrowRight || keys.d) player.x += player.speed;
  if (keys.ArrowUp || keys.w) player.y -= player.speed;
  if (keys.ArrowDown || keys.s) player.y += player.speed;

  player.x = Math.max(20, Math.min(W - 20, player.x));
  player.y = Math.max(30, Math.min(H - 30, player.y));

  // Automatic shooting
  if (player.cooldown > 0) player.cooldown--;

  if ((keys.Space || keys[" "]) && player.cooldown === 0) {
    shoot();
    player.cooldown = 12;
  }

  if (player.invincible > 0) player.invincible--;

  // Enemy waves
  spawnTimer++;

  if (spawnTimer > Math.max(20, 65 - level * 4)) {
    spawnEnemy();
    spawnTimer = 0;
  }

  bullets.forEach(b => b.y -= b.speed);
  enemyBullets.forEach(b => b.y += b.speed);

  enemies.forEach(e => {
    e.y += e.speed;

    e.fire++;

    if (e.fire > 100 && Math.random() < 0.04) {
      enemyBullets.push({
        x: e.x,
        y: e.y + 20,
        speed: 4
      });
      e.fire = 0;
    }
  });

  // Bullet hits
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (hit(b, e, 25) && !b.used) {
        e.hp--;
        b.used = true;

        if (e.hp <= 0) {
          e.dead = true;
          score += 10;
          spawnExplosion(e.x, e.y);
        }
      }
    });

    if (boss && hit(b, boss, 85) && !b.used) {
      boss.hp--;
      b.used = true;

      if (boss.hp <= 0) {
        score += 500;
        spawnExplosion(boss.x, boss.y, "#ff4c16");
        boss = null;
        bossSpawned = false;
        level++;
      }
    }
  });

  enemies = enemies.filter(e => !e.dead && e.y < H + 40);
  bullets = bullets.filter(b => b.y > -20 && !b.used);
  enemyBullets = enemyBullets.filter(b => b.y < H + 20);

  // Player collision
  if (player.invincible === 0) {
    enemies.forEach(e => {
      if (hit(player, e, 30)) {
        e.dead = true;
        damagePlayer();
      }
    });

    enemyBullets.forEach(b => {
      if (hit(player, b, 20)) {
        b.dead = true;
        damagePlayer();
      }
    });

    enemyBullets = enemyBullets.filter(b => !b.dead);
  }

  // Boss arrival
  if (score >= 150 && !boss && !bossSpawned) {
    spawnBoss();
  }

  updateBoss();

  // Difficulty progression
  level = 1 + Math.floor(score / 150);
  updateHUD();
}

function damagePlayer() {
  if (player.invincible > 0) return;

  lives--;
  player.invincible = 90;
  spawnExplosion(player.x, player.y, "#55ddff");
  updateHUD();

  if (lives <= 0) {
    gameOver();
  }
}

function draw() {
  drawBackground();

  // Player
  if (player.invincible === 0 || frame % 10 < 5) {
    drawPlane(player.x, player.y, "#5df4ff", 1.1);
  }

  // Player bullets
  ctx.fillStyle = "#ffff65";
  bullets.forEach(b => {
    ctx.fillRect(b.x - 2, b.y, 4, 14);
  });

  // Enemies
  enemies.forEach(e => {
    drawPlane(e.x, e.y, "#e94b43", 0.9);
  });

  // Enemy bullets
  ctx.fillStyle = "#ff7444";
  enemyBullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  drawBoss();
  drawParticles();
}

function loop() {
  if (!running || paused) return;

  update();
  draw();

  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  message.innerHTML =
    "GAME OVER<br>" +
    "Your Score: " + score +
    "<br><button onclick='startGame()'>PLAY AGAIN</button>";

  message.style.display = "block";
}

// Keyboard controls
window.addEventListener("keydown", e => {
  keys[e.key] = true;

  if (["ArrowUp", "ArrowDown", "ArrowLeft",
       "ArrowRight", " "].includes(e.key)) {
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key] = false;
});

// Mouse and touch controls
function movePlayer(e) {
  if (!running || paused) return;

  const rect = canvas.getBoundingClientRect();

  const x = (e.clientX - rect.left) * W / rect.width;
  const y = (e.clientY - rect.top) * H / rect.height;

  player.x = Math.max(20, Math.min(W - 20, x));
  player.y = Math.max(30, Math.min(H - 30, y));
}

canvas.addEventListener("pointermove", e => {
  if (e.buttons || e.pointerType === "touch") {
    movePlayer(e);
  }
});

canvas.addEventListener("pointerdown", e => {
  movePlayer(e);
  keys.Space = true;
});

canvas.addEventListener("pointerup", () => {
  keys.Space = false;
});

canvas.addEventListener("pointercancel", () => {
  keys.Space = false;
});

resetGame();
draw();

</script>
</body>
</html>
